services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: issuelens
      POSTGRES_USER: issuelens
      POSTGRES_PASSWORD: issuelens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuelens -d issuelens"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://issuelens:issuelens@postgres:5432/issuelens
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  frontend:
    build:
      context: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres-data:

