name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LANGFUSE_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Check backend
        run: uv run --frozen python scripts/check_backend.py

      - name: Check dataset schema and leakage
        run: uv run --frozen --offline pytest backend/tests/test_dataset.py backend/tests/test_case_validation.py

      - name: Rebuild offline investigations and patch metrics
        run: |
          uv run --frozen --offline pytest backend/tests/test_release_reproduction.py
          uv run --frozen --offline python scripts/run_patch_evaluation.py "$RUNNER_TEMP/patch-report.json"
          cmp "$RUNNER_TEMP/patch-report.json" data/patch-evaluation/report.json
        env:
          PYTHONPATH: backend/src

      - name: Check retrieval regression
        run: uv run --frozen --offline python scripts/check_retrieval_regression.py
        env:
          PYTHONPATH: backend/src

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Check frontend
        run: pnpm check
        working-directory: frontend

      - name: Start containers
        run: docker compose up --build --detach --wait

      - name: Smoke test
        run: |
          curl --fail http://localhost:3000/
          curl --fail http://localhost:3000/api/health | grep '"status":"ok"'
          curl --fail http://localhost:3000/api/demo/cases | grep '"case_id":"safe-dangerous-01"'
          curl --fail http://localhost:3000/api/demo/cases/starlette-issue-1552 | grep '"status":"supported"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/api/cases/starlette-issue-1552)" = 404

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
